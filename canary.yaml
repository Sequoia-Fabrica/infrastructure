# Canary: Sequoia Fabrica CO2 sensor
#
# Hardware (verified from the original CircuitPython firmware + I2C scan):
#   - WEMOS/LOLIN S2 Mini (ESP32-S2FN4R2, 4MB flash, 2MB PSRAM)
#   - Sensirion SCD30 CO2/temp/humidity sensor  @ I2C 0x61
#   - SSD1306 128x32 OLED                        @ I2C 0x3C
#   - Shared I2C bus: SDA = GPIO12, SCL = GPIO11, 50kHz (SCD30 clock-stretches)
#
# Reports to Home Assistant through the existing Mosquitto broker using
# MQTT discovery, so the device appears in HA automatically with no HA-side setup.

substitutions:
  name: canary
  friendly_name: Canary

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Sequoia Fabrica SCD30 CO2 monitor (LOLIN S2 Mini)

esp32:
  board: lolin_s2_mini
  variant: esp32s2
  framework:
    type: arduino

logger:
  hardware_uart: USB_CDC

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the hackerspace WiFi changes, the board opens this AP so it can be reconfigured.
  ap:
    ssid: ${name}-setup

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ${name}
  discovery: true
  discovery_prefix: homeassistant
  discovery_retain: true
  # MAC-based unique IDs so a second sensor won't collide; entity IDs like sensor.co2_sensor_co2
  discovery_unique_id_generator: mac
  discovery_object_id_generator: device_name

# Local status page at http://canary.local/
web_server:
  port: 80

i2c:
  sda: GPIO12
  scl: GPIO11
  frequency: 50kHz
  scan: true

sensor:
  - platform: scd30
    address: 0x61
    update_interval: 10s
    co2:
      name: CO2
      id: co2
      accuracy_decimals: 0
    temperature:
      name: Temperature
      id: temperature
      accuracy_decimals: 1
    humidity:
      name: Humidity
      id: humidity
      accuracy_decimals: 0

  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic

font:
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 20
    glyphs: "0123456789- "
  - file: "gfonts://Roboto"
    id: font_small
    size: 10

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x32"
    address: 0x3C
    update_interval: 2s
    lambda: |-
      if (id(co2).has_state()) {
        it.printf(0, 0, id(font_big), "%.0f", id(co2).state);
        it.print(127, 0, id(font_small), TextAlign::TOP_RIGHT, "ppm");
        it.print(127, 10, id(font_small), TextAlign::TOP_RIGHT, "CO2");
      } else {
        it.print(0, 0, id(font_big), "----");
      }
      if (id(temperature).has_state() && id(humidity).has_state()) {
        it.printf(0, 22, id(font_small), "%.1f C   %.0f%% rH",
                  id(temperature).state, id(humidity).state);
      }
      // Tiny WiFi/MQTT link indicator, bottom right
      if (!mqtt::global_mqtt_client->is_connected()) {
        it.print(127, 22, id(font_small), TextAlign::TOP_RIGHT, "offline");
      }
