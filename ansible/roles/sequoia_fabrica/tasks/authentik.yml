---
## Authentik
# Redis was removed in authentik 2025.10 (PostgreSQL now handles caching,
# sessions, tasks and websockets). Local storage moved from /media to /data
# in 2025.12, so uploaded media now lives under /opt/authentik/data/media.
- name: "Ensure /opt/authentik/custom-templates"
  become: true
  ansible.builtin.file:
    path: "/opt/authentik/custom-templates"
    state: directory
    owner: root
    group: root
    mode: ug=rwx,o=rx
- name: "Ensure /opt/authentik/database"
  become: true
  ansible.builtin.file:
    path: "/opt/authentik/database"
    state: directory
    owner: 70
    group: 70
    mode: u=rwx,go=
- name: "Ensure /opt/authentik/data"
  become: true
  ansible.builtin.file:
    path: "/opt/authentik/data"
    state: directory
    owner: 1000
    group: 1000
    mode: ug=rwx,o=rx
- name: "Ensure /opt/authentik/data/media/public"
  become: true
  ansible.builtin.file:
    path: "/opt/authentik/data/media/public"
    state: directory
    owner: 1000
    group: 1000
    mode: ug=rwx,o=rx
- name: "Ensure /opt/authentik/certs"
  become: true
  ansible.builtin.file:
    path: "/opt/authentik/certs"
    state: directory
    owner: 1000
    group: 1000
    mode: ug=rwx,o=rx
- name: Template /opt/authentik/.env
  become: true
  ansible.builtin.template:
    src: authentik.env.j2
    dest: /opt/authentik/.env
    owner: root
    group: root
    mode: ug=rw,o=
- name: Template /opt/authentik/docker-compose.yml
  become: true
  ansible.builtin.template:
    src: authentik.docker-compose.yml.j2
    dest: /opt/authentik/docker-compose.yml
    owner: root
    group: root
    mode: ug=rw,o=
# Brand assets. The brand record (terraform/authentik/brands.tf) references
# these by bare media key, e.g. "sequoia_fabrica_lockup.svg"; authentik serves
# them from the media "public/" storage prefix via signed /files URLs, so the
# files must live under public/. Add a file here first, then reference it in
# Terraform. See documentation/brand-style-guide.md for what each one is.
- name: Place authentik brand assets in /opt/authentik/data/media/public
  become: true
  ansible.builtin.copy:
    src: "authentik/{{ item }}"
    dest: "/opt/authentik/data/media/public/{{ item }}"
    owner: 1000
    group: 1000
    mode: ug=rw,o=r
  loop:
    - sequoia_fabrica_tree.svg            # previous logo; kept for rollback
    - sequoia_fabrica_lockup.svg          # tree + wordmark, self-theming (brand logo)
    - sequoia_fabrica_favicon.png         # tea-green tree on emerald (brand favicon)
    - sequoia_fabrica_flow_background.svg # emerald gradient + watermark (flow background)
- name: Authentik docker-compose
  become: true
  community.docker.docker_compose_v2:
    project_src: /opt/authentik
    remove_orphans: true
