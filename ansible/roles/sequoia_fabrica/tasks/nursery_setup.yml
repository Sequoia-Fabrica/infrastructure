---
- name: Create apt keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# Google retired the coral-edgetpu-stable apt repo (403, unsigned), which
# broke every apt cache update on nursery. gasket-dkms and libedgetpu1-std
# stay installed from it; Frigate's image ships its own libedgetpu.
- name: Remove the retired coral-edgetpu-stable apt repo
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/google-cloud.asc] https://packages.cloud.google.com/apt coral-edgetpu-stable main"
    state: absent

- name: Remove the Google Cloud apt key used by that repo
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings/google-cloud.asc
    state: absent
