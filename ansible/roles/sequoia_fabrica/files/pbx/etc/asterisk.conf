[options]
defaultlanguage = en
; keep the console quiet in `docker logs`; bump with `asterisk -rx "core set verbose 5"`
verbose = 3

[directories]
; the red phones' registrations live in astdb: keep it on the host (/opt/pbx/astdb) so a recreated container still
; knows where to ring them, instead of waiting up to an hour for the HT801s to register again
astdbdir => /var/lib/asterisk/astdb
