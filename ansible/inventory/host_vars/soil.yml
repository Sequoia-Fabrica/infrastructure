---
# soil is an ASRockRack Z490D4U-2L2T (i9-10900K, AST2500 BMC). The BMC's single
# smart-fan zone follows CPU Temp, which is intrinsically jittery: at idle the
# i9-10900K bounces 49-56 C with turbo micro-spikes to ~61 C every few seconds.
# Any sloped curve in that band makes the fans chase the noise (observed CPU fan
# 8600-10500 RPM at idle). So we pin the duty FLAT at 35% from 45-70 C -- wider
# than the whole idle+spike range -- so routine jitter produces zero fan change,
# and only sustained load above 70 C ramps the fans (to 100% by 90 C, before the
# 100 C Tjmax). 35% ~= the current idle duty, so idle RPM/temp don't regress.
# Applied to the BMC at boot.
fan_control:
  enabled: true
  # Both lists must have 11 entries (BMC smart-fan table breakpoints).
  temps: [45, 50, 55, 60, 65, 70, 74, 78, 82, 86, 90]
  duties: [35, 35, 35, 35, 35, 35, 44, 55, 68, 84, 100]
